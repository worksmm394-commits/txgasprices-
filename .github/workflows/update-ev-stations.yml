name: Weekly EV station refresh

on:
  schedule:
    # Sunday 06:00 UTC (1am Central) — NREL station data changes slowly
    # (new networks add stations over weeks/months), so weekly is plenty.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-ev-stations
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed so we can commit the refreshed ev-stations.json back to the repo.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch EV stations from NREL
        env:
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
        run: node fetch-ev-stations.js

      - name: Generate static pages
        run: node generate.js

      - name: Copy car-db.json into output
        run: cp car-db.json output/car-db.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy output --project-name=txgasprices

      - name: Commit refreshed ev-stations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ev-stations.json
          if git diff --quiet --cached; then
            echo "No changes in ev-stations.json — skipping commit."
          else
            git commit -m "chore: weekly EV station refresh [skip ci]"
            git push
          fi
